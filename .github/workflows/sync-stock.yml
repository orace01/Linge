name: Sync CJ stock

on:
  schedule:
    - cron: '17 */12 * * *' # twice a day (1 CJ call per variant, 1000 calls a day at most)
  push:
    branches: [main]
    paths: ['src/data/cj-catalog.ts'] # new or changed products: refresh their stock right away
  workflow_dispatch: {}

concurrency:
  group: sync-stock
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cj:sync
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
