name: Sync CJ stock

on:
  schedule:
    - cron: '17 */8 * * *' # every 8 hours (1 CJ call per variant, 1000 calls a day at most)
  workflow_dispatch: {}

concurrency:
  group: sync-stock
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run cj:sync
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
